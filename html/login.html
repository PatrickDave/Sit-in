<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCS Sit‑in | Landing Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="page-shell">
    <header class="nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-brand">
          <img class="nav-brand-logo" src="../image/CCSlogo.png" alt="College of Computer Studies Logo" />
          <span>College of Computer Studies Sit‑in Monitoring System</span>
        </a>
        <nav class="nav-links">
          <a href="index.html" class="nav-link">Home</a>
          <a href="#" class="nav-link">Community</a>
          <a href="#" class="nav-link">About</a>
          <a href="login.html" class="nav-link nav-link--active">Login</a>
          <a href="register.html" class="nav-link">Register</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="auth-layout">
        <section class="card card--login">
          <button type="button" class="btn btn-outline btn-back" onclick="location.href='index.html'">
            Back
          </button>
          <h2 class="card-title" style="text-align: center; margin-bottom: 1.4rem; font-family: 'Roboto', sans-serif; font-weight: 700;">User Login</h2>

          <div id="loginStatus"></div>

          <form id="loginForm" action="../api/login_process.php" method="POST" class="form">
            <div class="form-grid form-grid--single">
              <div class="field">
                <label for="studentId">ID Number</label>
                <input class="input" type="text" id="studentId" name="studentId" placeholder="e.g. 21301234" required />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" name="password" placeholder="••••••••" required />
              </div>
            </div>

            <div class="text-center my-3">
              <i class="fas fa-user-shield" style="font-size: 3rem; color: #2563eb;"></i>
            </div>

            <div class="form-footer" style="flex-direction: column; gap: 0.75rem;">
              <button type="submit" class="btn btn-primary btn-lg w-100" style="font-family: 'Roboto', sans-serif; font-weight: 600;">Login</button>
              <p class="muted-link">
                New here?
                <a href="register.html" class="btn btn-outline-primary btn-sm px-4">Create a student account</a>
              </p>
              <p class="muted-link">
                Admin? <a href="admin/adminLogin.html" class="btn btn-outline-primary btn-sm px-4" style="color: #2563eb;">Login here</a>
              </p>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="footer">
      &copy; <span data-year></span> College of Computer Studies · Sit‑in Monitoring System.
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const loginStatus = document.getElementById('loginStatus');
    
    if (params.get('registration') === 'success') {
      loginStatus.innerHTML = '<div class="alert alert-success py-2 small" style="border-radius: 10px;">' +
        '<i class="bi bi-check-circle-fill me-2"></i> Registration successful! Please log in.' +
        '</div>';
    } else if (params.get('error')) {
      const message = params.get('error') === 'invalid_password' ? 'Incorrect password.' : 'Student ID not found.';
      loginStatus.innerHTML = '<div class="alert alert-danger py-2 small" style="border-radius: 10px;">' +
        '<i class="bi bi-exclamation-triangle-fill me-2"></i> ' + message +
        '</div>';
    } else if (params.get('login') === 'success') {
      const toast = document.createElement('div');
      toast.className = 'toast-container position-fixed bottom-0 end-0 p-3';
      toast.innerHTML = '<div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">' +
        '<div class="toast-header bg-success text-white">' +
        '<i class="bi bi-check-circle-fill me-2"></i><strong class="me-auto">Success</strong>' +
        '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>' +
        '</div>' +
        '<div class="toast-body">Login successful! Redirecting...</div>' +
        '</div>';
      document.body.appendChild(toast);
      setTimeout(() => {
        window.location.href = 'student/studentDashboard.html';
      }, 1500);
    }
  </script>
</body>
</html>
