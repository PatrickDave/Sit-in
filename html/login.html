<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCS Sit-in | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body,
    .auth-card,
    .auth-card-body,
    .field label,
    .input,
    .btn,
    .auth-link-note {
      font-family: 'Montserrat', sans-serif;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-brand">
          <img class="nav-brand-logo" src="../image/CCSlogo.png" alt="College of Computer Studies Logo" />
          <span>College of Computer Studies Sit-in Monitoring System</span>
        </a>
        <nav class="nav-links">
          <a href="./index.html" class="nav-link">Home</a>
          <a href="./community.html" class="nav-link">Community</a>
          <a href="./about.html" class="nav-link">About</a>
          <a href="./login.html" class="nav-link nav-link--active">Login</a>
          <a href="./register.html" class="nav-link">Register</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="auth-layout auth-enter">
        <div class="auth-card-shell">
          <section class="card card--login auth-card">
            <button type="button" class="btn btn-outline btn-back" onclick="location.href='index.html'">
              Back
            </button>

            <div class="auth-card-body">
              <div id="loginStatus"></div>

              <h2 class="card-title auth-card-title">Sign-In</h2>
              <p class="auth-card-subtitle">Use your student ID or authorized administrator account to continue.</p>

              <form id="unifiedLoginForm" action="../api/login_process.php" method="POST" class="form">
                <div class="form-grid form-grid--single">
                  <div class="field">
                    <label for="loginId">Student ID or Administrator Username</label>
                    <input class="input" type="text" id="loginId" name="loginId" placeholder="e.g. 2382.... or admin" required />
                  </div>
                  <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                      <input class="input" type="password" id="password" name="password" placeholder="Enter your password" required />
                      <button type="button" class="password-toggle" data-password-target="password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="text-center my-3">
                  <i class="fas fa-user-shield" style="font-size: 3rem; color: #2563eb;"></i>
                </div>

                <div class="form-footer" style="flex-direction: column; gap: 0.75rem;">
                  <button type="submit" class="btn btn-primary btn-lg w-100" style="font-family: 'Roboto', sans-serif; font-weight: 600;">
                    Login
                  </button>
                  <p class="muted-link auth-link-note">
                    Need a student account?
                    <a href="register.html" class="btn btn-outline-primary btn-sm px-4">Create Account</a>
                  </p>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer">
      &copy; <span data-year></span> College of Computer Studies - Sit-in Monitoring System.
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/publicNav.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const loginStatus = document.getElementById('loginStatus');

    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', function () {
        const targetId = toggle.getAttribute('data-password-target');
        const input = document.getElementById(targetId);
        const icon = toggle.querySelector('i');
        if (!input || !icon) return;

        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        toggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    });

    if (params.get('registration') === 'success') {
      loginStatus.innerHTML = '<div class="alert alert-success py-2 small" style="border-radius: 10px;">' +
        '<i class="bi bi-check-circle-fill me-2"></i> Registration completed successfully. Please sign in to continue.' +
        '</div>';
    } else if (params.get('error')) {
      let message = 'Invalid credentials.';
      if (params.get('error') === 'invalid_password') {
        message = 'The password entered is incorrect.';
      } else if (params.get('error') === 'not_found') {
        message = 'No matching account was found. Please verify your student ID or administrator username.';
      } else if (params.get('error') === 'missing_fields') {
        message = 'Please provide your login ID and password.';
      }

      loginStatus.innerHTML = '<div class="alert alert-danger py-2 small" style="border-radius: 10px;">' +
        '<i class="bi bi-exclamation-triangle-fill me-2"></i> ' + message +
        '</div>';
    }
  </script>
</body>

</html>
