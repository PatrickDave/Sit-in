<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCS Sit‑in | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="page-shell">
    <!-- Top navigation -->
    <header class="nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-brand">
          <img class="nav-brand-logo" src="../image/CCSlogo.png" alt="College of Computer Studies Logo" />
          <span>College of Computer Studies Sit‑in Monitoring System</span>
        </a>
        <nav class="nav-links">
          <a href="./index.html" class="nav-link nav-link">Home</a>
          <a href="./community.html" class="nav-link">Community</a>
          <a href="./about.html" class="nav-link">About</a>
          <a href="./login.html" class="nav-link">Login</a>
          <a href="./register.html" class="nav-link nav-link--active">Register</a>
        </nav>
      </div>
    </header>

    <!-- Hero + Registration form -->
    <main class="main">
      <div class="auth-layout">
        <section class="card">
              <button type="button" class="btn btn-outline btn-back" onclick="location.href='login.html'">
                Back
              </button>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center;">
                <div class="card-visual" aria-hidden="true">
                  <img src="../image/Minion.gif" alt="Registration illustration" style="max-width: 100%; height: auto; border-radius: 8px;" />
                </div>
                <div>
                  <h2 class="card-title" style="text-align: center; margin-bottom: 1.4rem; font-family: 'Roboto', sans-serif; font-weight: 700;">Sign Up</h2>
              
              <form id="registration-form" action="../api/register_process.php" method="POST" class="form">
                <div id="registerStatus"></div>
                
                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="field">
                      <label for="studentId">ID Number</label>
                      <input id="studentId" name="studentId" type="text" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="email">Email</label>
                      <input id="email" name="email" type="email" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="lastName">Last Name</label>
                      <input id="lastName" name="lastName" type="text" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="firstName">First Name</label>
                      <input id="firstName" name="firstName" type="text" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="middleName">Middle Name</label>
                      <input id="middleName" name="middleName" type="text" class="input" placeholder="(Optional)" />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="address">Address</label>
                      <input id="address" name="address" type="text" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="yearlevel">Year Level</label>
                      <select id="yearlevel" name="yearlevel" class="input" required>
                        <option value="">Select Year</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="course">Course</label>
                      <select id="course" name="course" class="input" required>
                        <option value="">Select Course</option>
                        <option value="College of Arts and Sciences">College of Arts and Sciences</option>
                        <option value="College of Business and Accountancy">College of Business and Accountancy</option>
                        <option value="College of Computer Studies">College of Computer Studies</option>
                        <option value="College of Criminal Justice">College of Criminal Justice</option>
                        <option value="College of Customs Administration">College of Customs Administration</option>
                        <option value="College of Hospitality Management">College of Hospitality Management</option>
                        <option value="College of Nursing">College of Nursing</option>
                        <option value="College of Social Work">College of Social Work</option>
                        <option value="College of Teacher Education">College of Teacher Education</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="password">Password</label>
                      <input id="password" name="password" type="password" class="input" required />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="field">
                      <label for="confirmPassword">Repeat your password</label>
                      <input id="confirmPassword" name="confirmPassword" type="password" class="input" required />
                    </div>
                  </div>
                </div>

                <div class="form-footer mt-4 d-flex justify-content-end">
                  <button type="submit" class="btn btn-primary btn-lg" style="font-family: 'Roboto', sans-serif; font-weight: 600;">Register Now!</button>
                </div>
              </form>
                </div>
              </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      &copy; <span data-year></span> College of Computer Studies · Sit‑in Monitoring System.
    </footer>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/register.js"></script>
  </body>
</html>
